; PlatformIO project for the Arduino UNO R4 WiFi VPN Gateway.
;
; Build/upload:   pio run -t upload
; Serial monitor: pio device monitor -b 115200
;
; The Arduino IDE works too — just open arduino-r4-vpn-gateway.ino and select
; "Arduino UNO R4 WiFi" as the board.

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200

; ArduinoGraphics drives the scrolling boot banner on the LED matrix.
; The WiFiS3 and Arduino_LED_Matrix libraries ship with the R4 core.
lib_deps =
    arduino-libraries/ArduinoGraphics @ ^1.1.3

; ---------------------------------------------------------------------------
; To build the LIVE WireGuard tunnel (after commenting out VPN_SIMULATION in
; src/config.h) you also need a WireGuard library that exposes a `WireGuard`
; class. On ESP32-class targets, add:
;     https://github.com/ciniml/WireGuard-ESP32-Arduino
; See README.md → "Live tunnel mode" for the full picture and caveats.
; ---------------------------------------------------------------------------
